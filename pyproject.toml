[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pim-gan-reproducibility"
version = "1.0.0"
description = "PIM-GAN: Kinetics-constrained generative framework for microstructure evolution"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "Pillow>=9.0.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "PyYAML>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
